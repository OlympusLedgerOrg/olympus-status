owner: OlympusLedgerOrg
repo: olympus-status

sites:
  # Olympus is a desktop app (Tauri, Axum bound to 127.0.0.1 only by
  # design -- see CLAUDE.md) with no hosted API to monitor. The one
  # confirmed public HTTP endpoint is the GitHub Pages landing page.
  # Add another entry here if a second public deployment goes live
  # (e.g. a hosted demo instance).
  - name: Olympus landing page
    url: https://olympusledgerorg.github.io/Olympus/

status-website:
  baseUrl: /olympus-status
  logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  name: Olympus Status
  introTitle: "**Olympus Status** — uptime monitoring for Olympus's public endpoints."
  introMessage: >-
    Real-time status data from GitHub Actions, Issues, and Pages — no
    server required. History here is itself git-committed, which fits
    naturally with Olympus's own tamper-evidence story.
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
    - title: Olympus
      href: https://github.com/OlympusLedgerOrg/Olympus
